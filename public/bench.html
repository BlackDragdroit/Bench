<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bench</title>
<meta name="theme-color" content="#E7EDE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D2318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bench">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<script src="/config.js"></script>
<script src="/runtime.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --paper:#E7EDE1; --paper-2:#F3F6EF; --paper-3:#DAE3D3;
  --grid:rgba(40,92,58,.085); --grid-strong:rgba(40,92,58,.19);
  --ink:#1A2920; --ink-2:#4A5C50; --ink-3:#6F8275;
  --line:#BCCAB5; --line-strong:#1A2920;
  --accent:#1D5A39; --on-accent:#F3F6EF;
  --gold:#94700F; --sel:#2563C9;
  --danger:#A3392A; --ok:#2C7444; --warn:#A35F0C;
  --s-idea:#7D877F; --s-planning:#C9A200; --s-building:#D2691C; --s-testing:#2E66BC; --s-done:#2C7A45; --s-paused:#7A51A8; --d-cad:#C2462B; --d-bio:#B4407A;
  --shadow:0 1px 0 rgba(26,41,32,.05),0 14px 34px -14px rgba(26,41,32,.35);
  --scrim:rgba(18,30,22,.42);
  --pcb:0;
  --font:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-head:"Barlow Semi Condensed","Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0D2318; --paper-2:#122D1F; --paper-3:#1A3A29;
    --grid:rgba(214,184,96,.055); --grid-strong:rgba(214,184,96,.17);
    --ink:#E4ECE3; --ink-2:#A6BAAB; --ink-3:#83998A;
    --line:#2A4B3B; --line-strong:#B9C9BC;
    --accent:#D6B860; --on-accent:#13281C;
    --gold:#D6B860; --sel:#7FB2FF;
    --danger:#EE8B74; --ok:#74C690; --warn:#E9A955;
    --s-idea:#9AA69E; --s-planning:#E6C93C; --s-building:#F08C42; --s-testing:#6E9FEA; --s-done:#74C690; --s-paused:#AE8CDB; --d-cad:#F08A70; --d-bio:#E77DB0;
    --shadow:0 1px 0 rgba(0,0,0,.2),0 18px 40px -16px rgba(0,0,0,.6);
    --scrim:rgba(3,10,6,.62);
    --pcb:1; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D2318; --paper-2:#122D1F; --paper-3:#1A3A29;
  --grid:rgba(214,184,96,.055); --grid-strong:rgba(214,184,96,.17);
  --ink:#E4ECE3; --ink-2:#A6BAAB; --ink-3:#83998A;
  --line:#2A4B3B; --line-strong:#B9C9BC;
  --accent:#D6B860; --on-accent:#13281C;
  --gold:#D6B860; --sel:#7FB2FF;
  --danger:#EE8B74; --ok:#74C690; --warn:#E9A955;
  --s-idea:#9AA69E; --s-planning:#E6C93C; --s-building:#F08C42; --s-testing:#6E9FEA; --s-done:#74C690; --s-paused:#AE8CDB; --d-cad:#F08A70; --d-bio:#E77DB0;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 18px 40px -16px rgba(0,0,0,.6);
  --scrim:rgba(3,10,6,.62);
  --pcb:1; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 15px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
select option,select optgroup{background-color:var(--paper-2);color:var(--ink)}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
[hidden]{display:none!important}
.dim{color:var(--ink-2)}
.sm{font-size:13px}
.grow{flex:1}
.mono{font-family:var(--font-mono);font-size:13px;letter-spacing:-.01em}
.warn{color:var(--warn)}
.danger-text{color:var(--danger)!important}

/* ---------- shell ---------- */
#app{height:100%}
.shell{height:100%;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{display:flex;flex-direction:column;gap:3px;padding:18px 12px 14px;background:var(--paper-2);border-right:1.5px solid var(--line-strong);overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 20px;font:700 25px/1 var(--font-head);letter-spacing:.005em}
.brand svg{color:var(--accent);flex:none}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border:0;border-radius:6px;background:none;text-align:left;font-weight:500;color:var(--ink-2)}
.nav:hover{background:var(--paper-3);color:var(--ink)}
.nav[aria-current="page"]{background:var(--ink);color:var(--paper-2)}
.nav .count{margin-left:auto;font:500 12px var(--font-mono);opacity:.75}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:14px 4px 0;border-top:1px solid var(--line)}
.usage{font-size:12.5px;color:var(--ink-3);padding:0 6px}
.usage .meter{width:100%;margin-top:5px}
.main{overflow:auto;min-height:0;min-width:0;overscroll-behavior:contain;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;background-attachment:local}
.page{max-width:1040px;margin:0 auto;padding:30px 32px 72px}
.bottomnav{display:none}
@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .side{display:none}
  .bottomnav{display:flex;background:var(--paper-2);border-top:1.5px solid var(--line-strong)}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 9px;border:0;background:none;font-size:12.5px;font-weight:500;color:var(--ink-3);position:relative}
  .bottomnav button[aria-current="page"]{color:var(--ink)}
  .bottomnav button[aria-current="page"]::before{content:"";position:absolute;top:-1.5px;left:30%;right:30%;height:3px;background:var(--accent)}
  .page{padding:18px 16px 40px}
}

/* ---------- page header ---------- */
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.pagehead h1{margin:0;font:700 36px/1.02 var(--font-head);letter-spacing:-.005em}
.pagehead .sub{color:var(--ink-2);margin-top:5px}
.pagehead .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:820px){.pagehead h1{font-size:30px}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border:1.5px solid var(--ink);border-radius:5px;background:transparent;font-weight:600;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--paper-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.quiet{border-color:transparent}
.btn.danger{color:var(--danger);border-color:currentColor}
.btn.sm{min-height:32px;padding:0 10px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default;filter:none}
.ibtn{flex:none;width:38px;height:38px;display:inline-grid;place-items:center;border:0;border-radius:5px;background:transparent;color:var(--ink-2)}
.ibtn:hover{background:var(--paper-3);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default;background:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:13px;font-weight:500;color:var(--ink-2)}
.inp{width:100%;min-height:40px;padding:8px 11px;border:1.5px solid var(--line);border-radius:5px;background:var(--paper-2)}
.inp:focus{outline:none;border-color:var(--ink)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.5}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 17px) 17px,calc(100% - 12px) 17px;background-size:5px 5px;background-repeat:no-repeat;padding-right:30px}
.searchwrap{position:relative;display:flex;align-items:center;min-width:0}
.searchwrap svg{position:absolute;left:11px;color:var(--ink-3);pointer-events:none}
.searchwrap .inp{padding-left:35px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.toolbar .searchwrap{flex:0 1 280px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper-2);font-size:14px;font-weight:500}
.chip:hover{border-color:var(--ink-2)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper-2)}
.chip .n{font:500 12px var(--font-mono);opacity:.7}
.dot{width:10px;height:10px;border-radius:2px;background:var(--c)}
.meter{display:inline-block;width:72px;height:6px;border-radius:3px;background:var(--paper-3);overflow:hidden;vertical-align:middle}
.meter>i{display:block;height:100%;background:var(--gold)}
.status{display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.status::before{content:"";width:10px;height:10px;border-radius:2px;background:var(--c)}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.pill.short{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.pill.unk{color:var(--ink-3);background:var(--paper-3)}
.psub{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:13px;color:var(--ink-2);margin-top:1px}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:5px;background:var(--paper);overflow:hidden}
.stepper button{width:30px;height:30px;border:0;background:none;font-size:17px;line-height:1;color:var(--ink-2)}
.stepper button:hover{background:var(--paper-3);color:var(--ink)}
.stepper input{width:38px;height:30px;border:0;background:none;text-align:center;font:500 14px var(--font-mono);-moz-appearance:textfield;appearance:textfield}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input:focus{outline:none;background:var(--paper-3)}
.empty{padding:38px 24px;text-align:center;border:1.5px dashed var(--line);border-radius:6px;background:var(--paper-2)}
.empty h3{margin:0 0 6px;font:600 21px/1.2 var(--font-head)}
.empty p{margin:0 auto 18px;color:var(--ink-2);max-width:46ch}
.empty p:last-child{margin-bottom:0}
.loading{padding:40px 8px;color:var(--ink-2)}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--ink);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}

/* ---------- project list ---------- */
.plist{border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper-2);overflow:hidden}
.prow{display:grid;grid-template-columns:6px minmax(0,1fr) auto;align-items:stretch;width:100%;padding:0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.prow:first-child{border-top:0}
.prow:hover{background:var(--paper-3)}
.prow .band{background:var(--c)}
.prow-main{display:flex;flex-direction:column;justify-content:center;padding:14px 16px;min-width:0}
.prow-name{font:600 20px/1.2 var(--font-head)}
.prow-desc{color:var(--ink-2);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.prow-meta{display:flex;align-items:center;gap:20px;padding:0 18px;color:var(--ink-2);font-size:13.5px;white-space:nowrap}
.prow-meta .mstat{display:inline-flex;align-items:center;gap:8px}
.prow-meta .st{min-width:92px}
@media (max-width:820px){
  .prow{grid-template-columns:6px minmax(0,1fr)}
  .prow-main{padding-bottom:4px}
  .prow-meta{grid-column:2;flex-wrap:wrap;gap:6px 14px;padding:0 16px 13px}
  .prow-meta .st{min-width:0}
}
.backup-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:26px}

/* ---------- drop ---------- */
.dpage{max-width:760px}
.chip:disabled{opacity:.45;cursor:default}
.chip svg{flex:none}
.dhero{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;padding:26px 24px;border:1.5px solid var(--ink);border-radius:6px;background:var(--accent);color:var(--on-accent);text-align:left;box-shadow:var(--shadow);background-image:linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);background-size:20px 20px}
.dhero strong{font:700 40px/1 var(--font-head)}
.dhero small{font-size:15px;opacity:.85}
.dhero:hover{filter:brightness(1.08)}
.dscopes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:10px}
.dscope{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 14px 13px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper-2);text-align:left}
.dscope:hover{background:var(--paper-3)}
.dscope strong{font:600 19px/1.15 var(--font-head)}
.dscope small{color:var(--ink-3);font-size:13px}
@media (max-width:820px){.dscopes{grid-template-columns:1fr 1fr}.dhero strong{font-size:34px}}
.drolling{display:flex;flex-direction:column;gap:14px;padding:30px 4px}
.dreel{height:40px;overflow:hidden;font:700 32px/40px var(--font-head)}
.dreel span{display:block;animation:dreel 1.4s steps(7) infinite}
@keyframes dreel{to{transform:translateY(-280px)}}
@media (prefers-reduced-motion:reduce){.dreel span{animation:none}}
.dcard{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px 22px 18px 28px;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper-2);box-shadow:var(--shadow);overflow:hidden}
.dcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--c)}
.dcard.reveal{animation:dpop .35s ease-out}
@keyframes dpop{from{opacity:0;transform:translateY(10px) scale(.985)}}
@media (prefers-reduced-motion:reduce){.dcard.reveal{animation:none}}
.dcard-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.dcard h2{margin:0;font:700 32px/1.05 var(--font-head);overflow-wrap:anywhere}
.dpitch{margin:0;font-size:16.5px}
.dpayoff{margin:0;color:var(--ink-2)}
.dsec h3,.dsettings h3{margin:0 0 6px;font:600 13px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.duses,.dlist{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.duses li,.dlist li{display:flex;align-items:baseline;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}
.dlist li::before{content:"–";color:var(--ink-3)}
.dq{min-width:2.4em;color:var(--ink-2)}
.dsteps{margin:0;padding:0;list-style:none;counter-reset:ds}
.dsteps li{counter-increment:ds;display:grid;grid-template-columns:2em 1fr;padding:5px 0}
.dsteps li::before{content:counter(ds);font:500 13px/1.6 var(--font-mono);color:var(--ink-3)}
.dgotcha{margin:0;padding:10px 14px;border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent);border-radius:0 4px 4px 0}
.dgotcha b{display:block;font-size:13px;color:var(--warn)}
.dtier{display:flex;align-items:center;gap:10px;font:600 15px var(--font-head);color:var(--ink-2)}
.pips{display:inline-flex;gap:3px}
.pips i{width:12px;height:12px;border-radius:2px;border:1.5px solid var(--c)}
.pips i.on{background:var(--c)}
.drate{display:flex;flex-direction:column;gap:8px;padding-top:12px;border-top:1px dashed var(--line)}
.drate-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vote.down svg{transform:rotate(180deg)}
.vote[aria-pressed="true"].up{background:var(--ok);border-color:var(--ok);color:var(--paper-2)}
.vote[aria-pressed="true"].down{background:var(--danger);border-color:var(--danger);color:var(--paper-2)}
.dactions{display:flex;gap:8px;flex-wrap:wrap}
.dsettings{display:flex;flex-direction:column;gap:12px;margin-top:14px;padding:16px 18px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper-2)}
.daff{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;font-size:13.5px}
.daff .meter{width:100%}
.dfrom{display:flex;flex-direction:column;gap:6px;margin-top:14px;max-width:72ch}
.dfrom>.conf{align-self:flex-start;display:inline-flex;align-items:center;gap:5px}
.drate.compact{padding-top:0;border-top:0}

/* ---------- project view ---------- */
.crumb{margin:0 0 12px -10px}
.tblock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1.5px;background:var(--line-strong);border:1.5px solid var(--line-strong);border-radius:3px;overflow:hidden}
.tblock>div{background:var(--paper-2);padding:9px 14px 11px;min-width:0}
.tb-l{display:block;font-size:12.5px;color:var(--ink-3);margin-bottom:2px}
.tb-v{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 17px/1.25 var(--font-head)}
.tb-v .warn{font:600 14px var(--font)}
.tb-name{grid-column:span 3;display:flex;align-items:flex-start;gap:8px}
.tb-name h1{margin:0;font:700 34px/1.05 var(--font-head);overflow-wrap:anywhere}
.tb-sel{display:flex;align-items:center;gap:8px;position:relative}
.tb-sel::before{content:"";width:12px;height:12px;border-radius:2px;background:var(--c);flex:none}
.tb-sel select{appearance:none;border:0;background:transparent;font:600 18px var(--font-head);padding:2px 22px 2px 0;width:100%;min-width:0;cursor:pointer}
.tb-sel::after{content:"";position:absolute;right:4px;top:50%;width:7px;height:7px;border-right:1.5px solid var(--ink-2);border-bottom:1.5px solid var(--ink-2);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.tb-sel select:focus-visible{outline:2px solid var(--sel)}
.pdesc{margin:14px 0 0;color:var(--ink-2);max-width:72ch;white-space:pre-wrap}
@media (max-width:820px){
  .tblock{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tb-name{grid-column:span 2}
  .tblock>div:last-child{grid-column:span 2}
  .tb-name h1{font-size:28px}
}
.tabs{display:flex;gap:2px;margin:24px 0 16px;border-bottom:1.5px solid var(--line-strong);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;padding:10px 14px;border:0;background:none;font:600 17px var(--font-head);color:var(--ink-2)}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:8px;right:8px;bottom:-1.5px;height:3px;background:var(--accent)}
.tab .n{margin-left:5px;font:500 12px var(--font-mono);color:var(--ink-3)}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}

/* steps */
.steps{list-style:none;margin:0;padding:0;border:1.5px solid var(--line-strong);border-radius:6px;background:var(--paper-2);overflow:hidden}
.step{border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 6px 5px 12px}
.chk{width:24px;height:24px;display:grid;place-items:center;padding:0;border:1.5px solid var(--ink);border-radius:4px;background:transparent;color:var(--on-accent)}
.step.done .chk{background:var(--accent);border-color:var(--accent)}
.step-num{min-width:1.7em;text-align:right;font:500 13px var(--font-mono);color:var(--ink-3)}

.drop{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px;border:1.5px dashed var(--line);border-radius:6px;background:var(--paper-2)}

.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}

.lk-busy{display:flex;align-items:center;gap:10px;color:var(--ink-2)}

.lk-dup{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding-top:6px;color:var(--warn);font-weight:500}
.linkbtn{padding:0;border:0;background:none;color:var(--ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.pick-list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}

.pick-empty{padding:14px 12px;color:var(--ink-2)}
.pick-new{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:1.5px dashed var(--line);border-radius:6px;background:none;text-align:left}

.pick-new b{display:block}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translateX(-50%);z-index:200;max-width:calc(100% - 32px);padding:10px 16px;border-radius:6px;background:var(--ink);color:var(--paper-2);font-weight:500;box-shadow:var(--shadow)}
.notice{max-width:520px;margin:12vh auto 0;padding:0 24px}
.notice h1{font:700 30px/1.1 var(--font-head);margin:14px 0 8px}
.notice p{color:var(--ink-2)}
.notice .btn{text-decoration:none;margin-top:8px}
.ftile.missing{opacity:.65}
.ftile.missing .fsize{color:var(--warn)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);text-align:left;font-weight:600}

.opt small{display:block;font-weight:400;color:var(--ink-2);font-size:13px}

.ed{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;background:var(--paper);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.ed-save{padding:0 6px;font-size:13px;color:var(--ink-3);white-space:nowrap}

.ed-pens{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;padding:6px;border:1.5px solid var(--line-strong);border-radius:999px;background:var(--paper-2)}
.pen-c{width:30px;height:30px;border-radius:50%;border:2px solid transparent;background:var(--pc);box-shadow:inset 0 0 0 3px var(--paper-2)}

.pal-h b{flex:1;font:700 19px var(--font-head)}
.pal-b{display:flex;flex-direction:column;gap:10px;padding:12px 14px 24px;overflow:auto;min-height:0}
.pal-b>*,.modal-b>*{flex-shrink:0}
.pal-b h4{margin:8px 0 0;font:600 16px var(--font-head)}
.symgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sym{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--paper);font-size:12px;font-weight:500}
.sym:hover{border-color:var(--ink)}
.sym-ic{display:block;width:60px;height:34px;color:var(--ink)}
.sym-ic svg{width:100%;height:100%;display:block}
.pal-list{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:6px;overflow:hidden;background:var(--paper)}
.pal-list .pick{padding:8px 10px}
@media (max-width:820px){
  .ed-body{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  .ed-stage{grid-row:1}
  .ed-tools{grid-row:2;flex-direction:row;justify-content:space-around;padding:4px 6px;border-right:0;border-top:1.5px solid var(--line-strong);overflow:visible}
  .tool-sep{width:1px;height:30px;margin:0 2px}

  .ed-selbar button{min-width:50px}

}
.m-only{display:none}
@media (max-width:820px){.m-only{display:inline}}

const wq = new Map();

}

    try { await go(); }
    catch (e) {

const NATIVE = { png: 'image/png', jpg: 'image/jpeg', jpeg: 'image/jpeg', gif: 'image/gif', webp: 'image/webp', svg: 'image/svg+xml', mp4: 'video/mp4', webm: 'video/webm', pdf: 'application/pdf', csv: 'text/csv', md: 'text/markdown', json: 'application/json', txt: 'text/plain' };

  if (c.t === 'text') { promptDialog({ title: 'Edit label', label: 'Text', value: c.v || '', ok: 'Save' }).then(v => { if (!E || v == null || !v.trim()) return; const pre = snapState(); c.v = v.trim(); commit(pre); renderEd(); }); return; }
  let m;
  const L = h('input', { class: 'inp mono', autofocus: true }); L.value = c.l || '';
  const V = h('input', { class: 'inp' }); V.value = c.v || '';
  const save = () => { const pre = snapState(); c.l = L.value.trim(); c.v = V.value.trim(); m.close(); commit(pre); renderEd(); };
  [L, V].forEach(x => x.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); save(); } }));
  const nm = c.t === 'block' ? 'Part' : (SYM[c.t] || {}).name || 'Part';
  m = openModal({ title: `Edit ${nm.toLowerCase()}`, body: [
      c.t !== 'vcc' ? h('label', { class: 'field' }, h('span', null, 'Label'), L) : null,
      h('label', { class: 'field' }, h('span', null, c.t === 'vcc' ? 'Voltage or net name' : c.t === 'block' ? 'Name shown in the box' : 'Value'), V),
      c.t === 'block' && c.partId && S.parts.get(c.partId) ? h('p', { class: 'dim sm', style: 'margin:0' }, `Pins come from “${S.parts.get(c.partId).name}” in your library.`) : null],
    footer: [h('button', { class: 'btn quiet', onClick: () => m.close() }, 'Cancel'), h('button', { class: 'btn primary', onClick: save }, 'Save')] });
}
function place(t, o = {}) {
  const pre = snapState(); const ctr = viewCenter();
  let x = snap(ctr.x), y = snap(ctr.y);
  while (E.data.comps.some(c => c.x === x && c.y === y)) { x += 40; y += 40; }
  const s = SYM[t];
  const c = { id: uid8(), t, x, y, r: 0, l: '', v: '' };
  if (t === 'block') { c.pins = o.pins && o.pins.length ? o.pins : ['1', '2', '3', '4', '5', '6', '7', '8']; c.l = o.l || nextDesignator('U'); c.v = o.v || 'IC'; }
  else { c.l = o.l != null ? o.l : (s.pfx ? nextDesignator(s.pfx) : ''); c.v = o.v != null ? o.v : s.val; }
  if (o.partId) c.partId = o.partId;
  E.data.comps.push(c); E.sel = { k: 'c', id: c.id }; E.mode = 'select'; E.pend = null;
  commit(pre); if (E.palOpen) togglePalette(false); renderEd();
}
function placePart(part) {
  const sym = symbolForPart(part);
  if (sym) place(sym, { v: part.value || part.mpn || part.name, partId: part.id });
  else place('block', { pins: part.pins && part.pins.length ? part.pins : ['1', '2', '3', '4'], v: part.mpn || part.name, partId: part.id });
  const bom = curBom(E.pid);
  if (S.projects.has(E.pid) && !bom.some(b => b.partId === part.id)) { addToBom(E.pid, part.id, true); toast(`Placed ${part.name} and added it to the parts list`); }
}
function insertSketch(src) {
  const comps = clone(src.comps || []), wires = clone(src.wires || []), strokes = clone(src.strokes || []);
  const b = bounds({ comps, wires, strokes }); if (!b) { toast('That sketch is empty.'); return; }
  const pre = snapState(); const ctr = viewCenter();
  const dx = snap(ctr.x - (b.x + b.w / 2)), dy = snap(ctr.y - (b.y + b.h / 2));
  const idm = new Map(), used = new Set(E.data.comps.map(c => c.l).filter(Boolean));
  for (const c of comps) {
    const nid = uid8(); idm.set(c.id, nid); c.id = nid; c.x += dx; c.y += dy;
    const m = /^([A-Za-z]+)(\d+)$/.exec(c.l || ''); if (m && used.has(c.l)) c.l = nextDesignator(m[1], used); if (c.l) used.add(c.l);
  }
  const ws = wires.map(w => ({ ...w, id: uid8(), a: { ...w.a, c: idm.get(w.a.c) }, b: { ...w.b, c: idm.get(w.b.c) } })).filter(w => w.a.c && w.b.c);
  for (const s of strokes) { s.id = uid8(); s.p = s.p.map((v, i) => i % 2 ? v + dy : v + dx); }
  E.data.comps.push(...comps); E.data.wires.push(...ws); E.data.strokes.push(...strokes);
  E.sel = null; commit(pre); togglePalette(false); renderEd(); toast(`Combined “${src.name || 'sketch'}” into this one`);
}

/* ---- palette ---- */
function togglePalette(force) { E.palOpen = typeof force === 'boolean' ? force : !E.palOpen; E.pal.hidden = !E.palOpen; if (E.palOpen) renderPalette(); }
function renderPalette() {
  const p = S.projects.get(E.pid) || {};
  const partBtn = x => h('button', { class: 'pick', onClick: () => placePart(x) },
    h('span', { class: 'pick-main' }, h('span', { class: 'pick-name' }, x.name), h('span', { class: 'psub' }, x.mpn ? h('span', { class: 'mono' }, x.mpn) : null, h('span', null, symbolForPart(x) ? SYM[symbolForPart(x)].name : (x.pins || []).length ? `${x.pins.length}-pin block` : 'Block, no pins saved'))), icon('plus', 18));
  const bomParts = (p.bom || []).map(b => S.parts.get(b.partId) && { id: b.partId, ...S.parts.get(b.partId) }).filter(x => x && x.category !== 'Mechanical');
  const libList = h('div', { class: 'pal-list' });
  const drawLib = q => {
    const ql = (q || '').trim().toLowerCase();
    const res = partList().filter(x => x.category !== 'Mechanical' && (!ql || [x.name, x.mpn, x.category, x.value].join(' ').toLowerCase().includes(ql))).sort(byName).slice(0, 40);
    libList.hidden = !res.length && !ql;
    libList.replaceChildren(...(res.length ? res.map(partBtn) : [h('div', { class: 'pick-empty' }, ql ? 'Nothing matches.' : 'Your library is empty.')]));
  };
  const libQ = h('input', { class: 'inp', type: 'search', placeholder: 'Search your library', 'aria-label': 'Search your library', onInput: e => drawLib(e.target.value) });
  const combine = h('div', null, h('button', { class: 'btn sm', onClick: async () => {
    combine.replaceChildren(h('div', { class: 'lk-busy' }, h('span', { class: 'spin' }), 'Loading sketches…'));
    try {
      const snapAll = await sketchCol().get();
      const others = snapAll.docs.filter(d => d.id !== E.sid).map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.updated || 0) - (a.updated || 0));
      combine.replaceChildren(others.length ? h('div', { class: 'pal-list' }, others.map(s => h('button', { class: 'pick', onClick: () => insertSketch(s) },
        h('span', { class: 'pick-main' }, h('span', { class: 'pick-name' }, s.name || 'Untitled sketch'), h('span', { class: 'psub' }, h('span', null, (S.projects.get(s.projectId) || {}).name || 'Other project'), h('span', null, `${(s.comps || []).filter(c => c.t !== 'node').length} parts`))), icon('plus', 18))))
        : h('p', { class: 'dim sm', style: 'margin:0' }, 'There are no other sketches yet.'));
    } catch (e) { combine.replaceChildren(h('p', { class: 'dim sm', style: 'margin:0' }, 'Sketches didn’t load. Try again.')); }
  } }, 'Choose a sketch'));
  E.pal.replaceChildren(
    h('div', { class: 'pal-h' }, h('b', null, 'Add to sketch'), h('button', { class: 'ibtn', 'aria-label': 'Close', onClick: () => togglePalette(false) }, icon('x'))),
    h('div', { class: 'pal-b' },
      h('h4', null, 'Parts on this project’s list'),
      bomParts.length ? h('div', { class: 'pal-list' }, bomParts.map(partBtn)) : h('p', { class: 'dim sm', style: 'margin:0' }, 'Parts on the project’s list show up here, with their real pins.'),
      h('h4', null, 'Symbols'),
      h('div', { class: 'symgrid' }, PALETTE.map(([t, l]) => h('button', { class: 'sym', onClick: () => place(t) }, h('span', { class: 'sym-ic', html: symbolPreview(t) }), l))),
      h('h4', null, 'From your library'), libQ, libList,
      h('h4', null, 'Combine sketches'),
      h('p', { class: 'dim sm', style: 'margin:0' }, 'Copy another sketch into this one, for example a power supply or a sensor board you drew before.'), combine));
  drawLib('');
}

/* ---- keyboard ---- */
function edKey(e) {
  if (!E || modalStack.length) return;
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod) return;
  if (e.key === 'Delete' || e.key === 'Backspace') { if (E.sel) { e.preventDefault(); delSel(); } return; }
  if (e.key === 'Escape') { if (E.pend) { E.pend = null; renderEd(); } else if (E.palOpen) togglePalette(false); else if (E.sel) { E.sel = null; renderEd(); } else if (E.mode !== 'select') setMode('select'); else closeEditor(); return; }
  if (k === 'r' && E.sel && E.sel.k === 'c') { rotateSel(); return; }
  if (k === 'f' && E.sel && E.sel.k === 'w') { flipSel(); return; }
  if (k === 'v') setMode('select'); else if (k === 'w') setMode('wire'); else if (k === 'p') setMode('pen'); else if (k === 't') setMode('text'); else if (k === 'a') togglePalette();
}

/* ---- export ---- */
function exportSVG() {
  const b = bounds(E.data) || { x: -100, y: -100, w: 200, h: 200 }, pad = 40;
  const vb = [Math.floor(b.x - pad), Math.floor(b.y - pad), Math.ceil(b.w + pad * 2), Math.ceil(b.h + pad * 2)];
  return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="${vb.join(' ')}" width="${vb[2]}" height="${vb[3]}"><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="#ffffff"/><g fill="none" stroke="#1A2920" color="#1A2920" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${contentMarkup(E.data)}</g></svg>`;
}
async function svgToPng(svg) {
  const img = new Image();
  await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
  const w = img.naturalWidth || img.width, hh = img.naturalHeight || img.height;
  const scale = clamp(4000 / Math.max(w, hh), 0.5, 2.5);
  const c = document.createElement('canvas'); c.width = Math.round(w * scale); c.height = Math.round(hh * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error('png')), 'image/png'));
}
function exportMenu() {
  flushSave();
  const base = (E.name || 'sketch').replace(/[\\/:*?"<>|]+/g, '').trim() || 'sketch';
  let m;
  const opt = (ic, label, sub, fn, show = true) => show ? h('button', { class: 'opt', onClick: async () => { m.close(); try { await fn(); } catch (e) { console.warn(e); if (!e || e.code !== 'declined') toast(e && e.code === 'rejected_extension' ? 'That file type can’t be saved from here.' : 'Export didn’t work in this browser. Try SVG instead.'); } } }, icon(ic, 20), h('span', null, label, h('small', null, sub))) : null;
  m = openModal({ title: 'Export sketch', body: h('div', { class: 'opts' },
    opt('image', 'Save as image to project files', 'Adds a PNG to this project’s Files tab', async () => {
      const png = await svgToPng(exportSVG()); const res = await S.assets.upload(png, { type: 'image/png' });
      const pid = E.pid; const rec = { id: uid8(), assetId: res.id, name: base + '.png', type: 'image/png', size: png.size, enc: 'raw', added: Date.now() };
      patchProject(pid, { files: [...((S.projects.get(pid) || {}).files || []), rec] }); refreshUsage(); toast('Image saved to project files');
    }, !!S.assets && S.projects.has(E.pid)),
    opt('download', 'Download PNG', 'Picture for sharing or printing', async () => { await S.downloads.save({ filename: base + '.png', data: await svgToPng(exportSVG()) }); }, !!S.downloads),
    opt('download', 'Download SVG', 'Sharp at any size, opens in Inkscape or a browser', async () => { await S.downloads.save({ filename: base + '.svg', data: exportSVG() }); }, !!S.downloads)) });
}

/* ================= boot ================= */
async function boot() {
  render();
  if (!window.claude || typeof window.claude.use !== 'function') { S.err = 'noclaude'; render(); return; }
  let db, user;
  try { [db, user] = await Promise.all([claude.use('db'), claude.use('user')]); } catch (e) { db = null; }
  if (!db || !user) { S.err = 'nodb'; render(); return; }
  let id = null; try { id = await user.id(); } catch (e) {}
  if (!id) { S.err = 'nodb'; render(); return; }
  S.db = db; S.uid = id;
  projCol().onSnapshot(snap => {
    S.projects = new Map(snap.docs.map(d => [d.id, withPending(projCol().doc(d.id).path, d.data())]));
    S.loaded.projects = true; schedRender();
  }, onDbErr);
  partCol().onSnapshot(snap => {
    S.parts = new Map(snap.docs.map(d => [d.id, withPending(partCol().doc(d.id).path, d.data())]));
    S.loaded.parts = true; schedRender();
  }, onDbErr);
  dropCol().onSnapshot(snap => {
    const d = snap.docs.find(x => x.id === 'state');
    S.drop = d ? withPending(dropCol().doc('state').path, d.data()) : S.drop; schedRender();
  }, onDbErr);
  if (S.route.view === 'project' && S.route.pid) subscribeSketches(S.route.pid);
  S.ready = true; render();
  claude.use('assets').then(a => { S.assets = a; schedRender(); if (a) refreshUsage(); }).catch(() => {});
  claude.use('downloads').then(d => { S.downloads = d; schedRender(); }).catch(() => {});
  claude.use('sample').then(async s => { S.sample = s; if (s) { try { const l = await s.limits(); S.imgOK = !!(l && l.images); } catch (e) {} } }).catch(() => {});
}
boot();
if ('serviceWorker' in navigator) window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(e => console.warn('sw', e)); });
</script>
